[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fxrisk"
version = "1.0.0"
description = "Monte Carlo simulation of GBP/LKR currency risk in overseas tuition payments"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Dinethmin Manditha Uduwilaarachchi" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "matplotlib>=3.7", "requests>=2.28"]

[project.optional-dependencies]
dev = ["pytest>=7", "statsmodels>=0.14", "jupyter", "nbconvert"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
